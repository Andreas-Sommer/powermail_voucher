<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">

	<f:flashMessages />

	<f:form action="import" enctype="multipart/form-data">
		<f:form.select class="form-select form-select-lg mb-3" id="campaign" name="campaign" options="{campaigns}" value="{campaign}" sortByOptionLabel="1" optionLabelField="title" optionValueField="uid" prependOptionLabel="{f:translate(key: 'tx_powermailvoucher_backend.select_campaign')}" additionalAttributes="{required: ''}" />

		<f:form.upload class="form-control mb-3" name="file" additionalAttributes="{accept: '.csv', required: ''}" />
		<f:form.button class="btn btn-primary">upload</f:form.button>
	</f:form>


	<aside>
		<h3><f:translate key="tx_powermailvoucher_backend.csv_format">CSV Format</f:translate></h3>
		<ul>
			<li><f:translate key="tx_powermailvoucher_backend.no_headlines">No headlines</f:translate></li>
			<li><f:translate key="tx_powermailvoucher_backend.delimiter">delimiter: new line</f:translate></li>
		</ul>

		<h3><f:translate key="tx_powermailvoucher_backend.example">Example</f:translate></h3>
		<f:format.raw><f:translate key="tx_powermailvoucher_backend.foobar">foo
			bar</f:translate></f:format.raw>
	</aside>
</f:section>
</html>
